<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>学习记录 · 职英写作训练营</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div class="brand">
        <span class="logo">✍</span>
        <div>
          <div class="name">职英写作训练营</div>
          <div class="sub">职场英语挑战赛写作大赛 · 备赛训练</div>
        </div>
      </div>
      <nav class="site-nav">
        <a href="./index.html">题库</a>
        <a href="./history.html" class="active">学习记录</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <div class="stats">
      <div class="stat"><div class="num" id="stTimes">–</div><div class="lbl">累计作答</div></div>
      <div class="stat"><div class="num" id="stAvg">–</div><div class="lbl">平均总分</div></div>
      <div class="stat"><div class="num" id="stBest">–</div><div class="lbl">最高总分</div></div>
      <div class="stat"><div class="num" id="stRecent">–</div><div class="lbl">最近总分</div></div>
    </div>

    <section class="card">
      <h2 class="sec-title">进步曲线（总分趋势）</h2>
      <div class="chart-wrap" id="trendChart"></div>
      <p class="timer-lbl" id="trendNote"></p>
    </section>

    <section class="card">
      <div style="display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:12px">
        <h2 class="sec-title" style="margin:0">作答明细</h2>
        <span style="flex:1"></span>
        <button class="btn sm" id="btnExport">导出记录 (JSON)</button>
        <button class="btn sm danger" id="btnClear">清空记录</button>
      </div>
      <div class="history-table-wrap">
        <table class="history" id="historyTable">
          <thead>
            <tr>
              <th>时间</th><th>题目</th><th>题型</th><th>字数</th><th>用时</th>
              <th>总分</th><th>四维小分（内容/语法/组织/格式）</th><th></th>
            </tr>
          </thead>
          <tbody id="historyBody"></tbody>
        </table>
      </div>
      <div class="empty-tip hidden" id="historyEmpty">还没有作答记录。去 <a href="./index.html">题库</a> 挑一道题开始练吧。</div>
    </section>
  </main>

  <footer class="site-footer">记录保存在本机浏览器 localStorage · 清空不可恢复，可先导出备份</footer>

  <script src="./js/history.js"></script>
</body>
</html>
