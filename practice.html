<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>作答中 · 职英写作训练营</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div class="brand">
        <span class="logo">✍</span>
        <div>
          <div class="name">职英写作训练营</div>
          <div class="sub">职场英语挑战赛写作大赛 · 备赛训练</div>
        </div>
      </div>
      <nav class="site-nav">
        <a href="./index.html">题库</a>
        <a href="./history.html">学习记录</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <div class="practice-wrap" id="practiceWrap">
      <!-- 左：题目面板 -->
      <section class="qpanel card sticky-panel" id="qPanel">
        <div class="empty-tip" id="qLoading">题目加载中…</div>
      </section>

      <!-- 右：写作区 -->
      <section>
        <div class="timer-bar">
          <div>
            <div class="timer" id="timer">--:--</div>
            <div class="timer-lbl" id="timerLbl">限时 <span id="limitTxt">–</span> 分钟</div>
          </div>
          <div class="timer-lbl" style="text-align:right">
            目标字数 ≥ <b id="minWordsTxt">–</b> 词<br>
            机考节奏：到点自动交卷
          </div>
        </div>

        <div class="card write-card">
          <div class="counter-line">
            <span>已写 <b id="wcNow">0</b> 词 / 共 <b id="ccNow">0</b> 字符</span>
            <span>目标 ≥ <b id="wcTarget">–</b> 词</span>
            <span id="wcStatus" class="bad">未达标</span>
          </div>
          <textarea id="essay" placeholder="在此输入你的英文作文…（草稿每 30 秒自动保存到本机）"></textarea>
          <div class="actions">
            <button class="btn" id="btnSave" title="立即保存草稿">💾 保存草稿</button>
            <button class="btn" id="btnClearDraft">🗑 清空草稿</button>
            <span style="flex:1"></span>
            <button class="btn primary" id="btnSubmit">提交判分</button>
          </div>
          <p class="timer-lbl" id="draftNote" style="margin-top:10px"></p>
        </div>
      </section>
    </div>
  </main>

  <footer class="site-footer">
    提交后由系统按官方四维标准即时判分 · 交卷后不可修改 · 数据仅保存在本机浏览器
  </footer>

  <!-- 提交确认弹窗 -->
  <dialog class="modal" id="confirmDialog">
    <h3>确认交卷？</h3>
    <p id="confirmText">提交后将立即判分，交卷后不可修改。</p>
    <p class="timer-lbl">正式机考为整卷计时（省赛 120 分钟两题、决赛 150 分钟三题），本平台按单题限时训练。</p>
    <div class="actions">
      <button class="btn" id="confirmCancel">再检查一下</button>
      <button class="btn primary" id="confirmOk">确认交卷</button>
    </div>
  </dialog>

  <!-- 判分加载遮罩 -->
  <div class="loading-overlay hidden" id="loadingOverlay">
    <div class="loading-box">
      <div class="spinner"></div>
      <div id="loadingText">AI 阅卷中，请稍候…</div>
    </div>
  </div>

  <script src="./js/config.js"></script>
  <script src="./js/questions-data.js"></script>
  <script src="./js/chart.js"></script>
  <script src="./js/scorer.js"></script>
  <script src="./js/practice.js"></script>
</body>
</html>
